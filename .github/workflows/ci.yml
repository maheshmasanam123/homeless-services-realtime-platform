name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 11 * * *"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install minimal deps
        run: pip install ruff pytest faker pandas pyyaml
      - run: ruff check .
      - run: pytest -q tests/

  terraform-fmt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: cd iac/terraform && terraform fmt -check -recursive || true
