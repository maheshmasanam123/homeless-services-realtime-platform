name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 11 * * *"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r requirements.txt && pip install ruff pytest
      - run: ruff check .
      - run: pytest -q

  medallion-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -r requirements.txt
      - run: python -m generator.run --clients 500 --projects 10
      - run: python notebooks/bronze/batch_load_hmis_csvs.py
      - run: python notebooks/silver/conform_and_mask.py
      - run: python notebooks/gold/build_star_schema.py
      - run: python great_expectations/reconciliation.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: cd iac/terraform && terraform fmt -check && terraform init -backend=false && terraform validate
